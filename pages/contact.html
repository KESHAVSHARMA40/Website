<!DOCTYPE html>

    <meta charset="UTF-8" />

  <body>
    <!-- Reusable Nav -->

    <!-- Contact Section -->
    <section class="contact-page">
      <div class="container">
        <h2>Contact Me</h2>
        <p>If you’d like to discuss a role or project, I’d love to hear from you!</p>

        <form
          action="https://formspree.io/f/mwpojdzy"
          method="POST"
          class="contact-form"
        >
        <input type="text" name="_gotcha" style="display:none" />
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <textarea
            name="message"
            placeholder="Your Message"
            rows="6"
            required
          ></textarea>
          <button type="submit" class="btn">Send Message</button>
          
        </form>
      </div>
    </section>

    <script src="../js/script.js"></script>
  </body>
</html>
